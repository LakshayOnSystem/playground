<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groq Playground</title>
<style>
:root{
  --bg:#f6f5f3; --panel:#ffffff; --ink:#1b1c1f; --muted:#74767d; --line:#e3e1dc;
  --accent:#f55036; --accent-ink:#ffffff; --user:#efede8; --think:#8a8d95;
  --font:"Inter","Segoe UI",system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141517;--panel:#1c1d20;--ink:#ecebe8;--muted:#8d8f96;--line:#2c2d31;--user:#26272b;--think:#8d8f96}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
header h1 b{color:var(--accent)}
.keybox{margin-left:auto;display:flex;gap:8px;align-items:center}
.keybox input{width:260px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono);font-size:13px}
.keybox small{color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px}
.chat{display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.empty{margin:auto;color:var(--muted);text-align:center;max-width:340px}
.msg{max-width:760px;width:100%;margin:0 auto}
.msg .who{font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.msg.user .body{background:var(--user);padding:10px 14px;border-radius:12px;white-space:pre-wrap}
.msg.assistant .body{white-space:pre-wrap}
.msg.error .body{color:var(--accent);white-space:pre-wrap}
.think{color:var(--think);font-size:13.5px;border-left:2px solid var(--line);padding-left:10px;margin-bottom:8px;white-space:pre-wrap}
.think:empty{display:none}
.meta{font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--mono)}

.composer{border-top:1px solid var(--line);background:var(--panel);padding:12px 20px}
.composer .inner{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;resize:none;max-height:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}

aside{border-left:1px solid var(--line);background:var(--panel);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
aside label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
aside label span{float:right;font-family:var(--mono);color:var(--muted);font-weight:400}
aside select,aside input[type=number],aside textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
aside textarea{min-height:90px;resize:vertical}
aside input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center}

@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:42vh}
  .keybox input{width:150px}
  header{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1><b>groq</b> playground</h1>
</header>

<main>
  <section class="chat">
    <div id="log"><div class="empty" id="empty">Pick a model and send a message.</div></div>
    <div class="composer">
      <div class="inner">
        <textarea id="input" rows="1" placeholder="Write a message. Enter sends, Shift+Enter adds a line."></textarea>
        <button class="btn" id="clear">Clear</button>
        <button class="btn primary" id="send">Send</button>
      </div>
    </div>
  </section>

  <aside>
    <div>
      <label for="model">Model</label>
      <select id="model">
        <option>openai/gpt-oss-120b</option>
        <option>openai/gpt-oss-20b</option>
        <option>llama-3.3-70b-versatile</option>
        <option>llama-3.1-8b-instant</option>
      </select>
    </div>
    <div>
      <label for="system">System message</label>
      <textarea id="system" placeholder="Optional"></textarea>
    </div>
    <div>
      <label for="temp">Temperature <span id="tempv">1</span></label>
      <input id="temp" type="range" min="0" max="2" step="0.05" value="1">
    </div>
    <div>
      <label for="top">Top P <span id="topv">1</span></label>
      <input id="top" type="range" min="0" max="1" step="0.05" value="1">
    </div>
    <div>
      <label for="max">Max completion tokens</label>
      <input id="max" type="number" min="1" max="32768" value="2048">
    </div>
    <div id="effortwrap">
      <label for="effort">Reasoning effort</label>
      <select id="effort"><option>low</option><option selected>medium</option><option>high</option></select>
    </div>
    <div class="row">
      <label for="stream" style="margin:0">Stream</label>
      <input id="stream" type="checkbox" checked>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), input = $('input'), sendBtn = $('send');
let history = [];
let controller = null;

});

// Slider readouts
[['temp','tempv'],['top','topv']].forEach(([a,b]) => $(a).addEventListener('input', () => $(b).textContent = $(a).value));

// Reasoning effort only applies to gpt-oss models
function syncModel(){ $('effortwrap').style.display = $('model').value.includes('gpt-oss') ? '' : 'none'; }
$('model').addEventListener('change', syncModel); syncModel();

input.addEventListener('input', () => { input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,180)+'px'; });
input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
sendBtn.addEventListener('click', () => controller ? controller.abort() : send());
$('clear').addEventListener('click', () => { if(controller) controller.abort(); history=[]; log.innerHTML='<div class="empty">Pick a model and send a message.</div>'; });

function addMsg(role, text){
  const e = $('empty'); if(e) e.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = '<div class="who">' + (role==='user'?'You':role==='error'?'Error':'Assistant') + '</div>' +
    (role==='assistant' ? '<div class="think"></div>' : '') + '<div class="body"></div>';
  el.querySelector('.body').textContent = text || '';
  log.appendChild(el); log.scrollTop = log.scrollHeight;
  return el;
}

async function send(){
  const text = input.value.trim();
  if(!text) return;

  input.value=''; input.style.height='auto';
  addMsg('user', text);
  history.push({role:'user', content:text});

  const messages = [];
  if($('system').value.trim()) messages.push({role:'system', content:$('system').value.trim()});
  messages.push(...history);

  const body = {
    model: $('model').value,
    messages,
    temperature: +$('temp').value,
    top_p: +$('top').value,
    max_completion_tokens: +$('max').value,
    stream: $('stream').checked
  };
  if(body.model.includes('gpt-oss')) body.reasoning_effort = $('effort').value;

  const el = addMsg('assistant','');
  const bodyEl = el.querySelector('.body'), thinkEl = el.querySelector('.think');
  let answer = '', started = performance.now();

  controller = new AbortController();
  sendBtn.textContent = 'Stop'; sendBtn.classList.remove('primary');

  try{
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
      signal: controller.signal
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error((err.error && err.error.message) || ('Request failed with status ' + res.status));
    }

    if(body.stream){
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = '';
      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split('\n'); buf = lines.pop();
        for(const line of lines){
          if(!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if(data==='[DONE]') continue;
          try{
            const d = JSON.parse(data).choices[0].delta || {};
            if(d.reasoning) thinkEl.textContent += d.reasoning;
            if(d.content){ answer += d.content; bodyEl.textContent = answer; }
            log.scrollTop = log.scrollHeight;
          }catch(e){}
        }
      }
    } else {
      const json = await res.json();
      const m = json.choices[0].message;
      if(m.reasoning) thinkEl.textContent = m.reasoning;
      answer = m.content || ''; bodyEl.textContent = answer;
    }
    history.push({role:'assistant', content:answer});
    const meta = document.createElement('div');
    meta.className='meta'; meta.textContent = ((performance.now()-started)/1000).toFixed(2)+'s';
    el.appendChild(meta);
  }catch(err){
    if(err.name==='AbortError'){
      if(answer) history.push({role:'assistant', content:answer}); else history.pop();
      bodyEl.textContent = answer || 'Stopped.';
    } else {
      el.remove(); history.pop();
      addMsg('error', err.message);
    }
  }finally{
    controller = null;
    sendBtn.textContent='Send'; sendBtn.classList.add('primary');
    input.focus();
  }
}
</script>
</body>
</html>
